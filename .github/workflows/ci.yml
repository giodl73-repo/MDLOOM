name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets

      - name: Test (unit + integration)
        run: cargo test

      - name: Test (release mode)
        run: cargo test --release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build debug binary
        run: cargo build
      - name: E2E — clean file exits 0
        run: ./target/debug/glint tests/fixtures/perfect_box.md
      - name: E2E — broken file exits 1
        run: |
          ./target/debug/glint tests/fixtures/width_mismatch.md && exit 1 || true
      - name: E2E — rich format is valid JSON
        run: |
          ./target/debug/glint --format rich --no-fail tests/fixtures/width_mismatch.md | python3 -c "import sys,json; json.load(sys.stdin)"
      - name: E2E — stats command
        run: ./target/debug/glint stats tests/fixtures/
