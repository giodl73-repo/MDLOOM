[package]
name = "proof"
version = "0.5.0"
edition = "2021"
description = "Document quality assurance for markdown — figures, tables, links, ASCII art, and source compilation via the md:// URI scheme."
license = "MIT"
repository = "https://github.com/giodl73-repo/PROOF"
keywords = ["markdown", "figures", "ascii-art", "validation", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "proof"
path = "src/main.rs"

[lib]
name = "proof_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1.10"
walkdir = "2"
colored = "2"
unicode-width = "0.2"
globset = "0.4"
anyhow = "1"
thiserror = "2"
serde_json = "1"
similar = "2"
# Local development: uses sibling directory (cargo install --path . uses this)
# Published: change to mdpath = "0.1" once crates.io is set up
mdpath = { path = "../mdpath" }
# Figure import — image-to-ASCII conversion
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"], optional = true }
# SVG rasterization (optional — enable with --features svg)
resvg = { version = "0.44", optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
figure = ["image"]
svg = ["figure", "resvg"]
