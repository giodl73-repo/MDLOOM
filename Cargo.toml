[package]
name = "proof"
version = "0.7.1"
edition = "2021"
description = "Document quality assurance for markdown — figures, tables, links, ASCII art, and source compilation via the md:// URI scheme."
license = "MIT"
repository = "https://github.com/giodl73-repo/PROOF"
keywords = ["markdown", "figures", "ascii-art", "validation", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "proof"
path = "src/main.rs"

[lib]
name = "proof_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1.10"
walkdir = "2"
colored = "2"
unicode-width = "0.2"
globset = "0.4"
anyhow = "1"
thiserror = "2"
serde_json = "1"
similar = "2"
notify = { version = "6", features = ["macos_fsevent"] }
regex = "1"
# Workspace sub-crates
proof-canvas = { path = "crates/proof-canvas" }
proof-math   = { path = "crates/proof-math" }
# Pinned by SHA so downstream consumers (e.g. icelines) can build from
# git without needing the mdpath repo as a sibling on disk. Local dev
# overrides this via `.cargo/config.toml` with `[patch."https://...MDPATH"]`
# pointing at `../mdpath` — see README for the snippet. Once mdpath
# publishes to crates.io we'll switch to a version constraint.
mdpath = { git = "https://github.com/giodl73-repo/MDPATH", rev = "6666cb4368ebc4b1b7ec8d77169b524821e90e9c" }
pebble = { git = "https://github.com/giodl73-repo/PEBBLE", rev = "ec4ac5a1995b1d49a2070d345e4bad8975602178" }
# Figure import — image-to-ASCII conversion
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"], optional = true }
# SVG rasterization (optional — enable with --features svg)
resvg = { version = "0.44", optional = true }
pulldown-cmark = "0.12"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
slice-core = { git = "https://github.com/giodl73-repo/SLICE", package = "slice-core", rev = "20b64416364fad8a384eb9f17d0a0a19785a20b1" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
figure = ["image"]
svg = ["figure", "resvg"]
