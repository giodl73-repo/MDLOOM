[package]
name = "mdloom"
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
description = "Weave Markdown into checked, cross-referenced, multi-format documents."
license = "MIT"
repository = "https://github.com/giodl73-repo/MDLOOM"
homepage = "https://github.com/giodl73-repo/MDLOOM"
documentation = "https://docs.rs/mdloom"
readme = "README.md"
keywords = ["markdown", "figures", "ascii-art", "validation", "documentation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mdloom"
path = "src/main.rs"

[lib]
name = "mdloom_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rayon = "1.10"
walkdir = "2"
colored = "2"
unicode-width = "0.2"
globset = "0.4"
anyhow = "1"
thiserror = "2"
serde_json = "1"
similar = "2"
notify = { version = "6", features = ["macos_fsevent"] }
regex = "1"
zip = { version = "0.6", default-features = false }
# Workspace sub-crates
mdloom-canvas = { version = "0.1.0", path = "crates/mdloom-canvas" }
mdloom-math   = { version = "0.1.0", path = "crates/mdloom-math" }
# Pinned by SHA so downstream consumers (e.g. icelines) can build from
# git without needing the mdpath repo as a sibling on disk. Local dev
# overrides this via `.cargo/config.toml` with `[patch."https://...MDPATH"]`
# pointing at `../mdpath` — see README for the snippet. Once mdpath
# publishes to crates.io we'll switch to a version constraint.
mdpath = { version = "0.5.0", git = "https://github.com/giodl73-repo/MDPATH", rev = "6666cb4368ebc4b1b7ec8d77169b524821e90e9c" }
# Figure import — image-to-ASCII conversion
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"], optional = true }
# SVG rasterization (optional — enable with --features svg)
resvg = { version = "0.44", optional = true }
pulldown-cmark = "0.12"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[features]
figure = ["image"]
svg = ["figure", "resvg"]
